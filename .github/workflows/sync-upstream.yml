name: 同步上游 fork

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

jobs:
  sync-fork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 上游有新提交时，git merge 会生成合并提交；Runner 必须先配置提交者身份。
      - name: 配置合并提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 准备上游同步
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/eternity4719/HowToLiveBetter.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork 已包含上游最新提交"
            exit 0
          fi

          if git merge --no-edit upstream/main; then
            exit 0
          fi

          conflict_files="$(git diff --name-only --diff-filter=U)"
          if [[ -z "$conflict_files" ]]; then
            echo "上游合并失败，但没有可处理的冲突文件。" >&2
            exit 1
          fi

          # 目前 fork 在这两个文件中的定制仅是仓库/Pages 链接；保留上游正文和统计，再恢复 fork 链接。
          while IFS= read -r path; do
            case "$path" in
              README.md|index.html) ;;
              *)
                echo "发现未配置自动解决规则的冲突：$path" >&2
                exit 1
                ;;
            esac
          done <<< "$conflict_files"

          while IFS= read -r path; do
            git checkout --theirs -- "$path"
          done <<< "$conflict_files"

          python - <<'PY'
          from pathlib import Path

          replacements = (
              ("https://github.com/eternity4719/HowToLiveBetter",
               "https://github.com/cc-studio-hub/HowToLiveBetter"),
              ("https://eternity4719.github.io/HowToLiveBetter",
               "https://cc-studio-hub.github.io/HowToLiveBetter"),
          )
          for name in ("README.md", "index.html"):
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          git add -- README.md index.html
          git commit --no-edit

      - name: 创建或更新 fork 同步 PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: 同步上游 fork"
          title: "自动同步上游"
          body: |
            此 PR 由 GitHub Actions 自动创建或更新，随后会自动合并。
            变更仅同步自 eternity4719/HowToLiveBetter。

      - name: 自动合并上游同步 PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      # GITHUB_TOKEN 创建的 PR 检查可能需要人工批准；合并后显式构建并发布 main 上的电子书。
      - name: 触发电子书构建与发布
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run book.yml --repo "$GITHUB_REPOSITORY" --ref main
