name: 同步上游 fork

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

jobs:
  sync-fork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 准备上游同步
        run: |
          git remote add upstream https://github.com/eternity4719/HowToLiveBetter.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork 已包含上游最新提交"
          else
            git merge --no-edit upstream/main
          fi

      - name: 创建或更新 fork 同步 PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: 同步上游 fork"
          title: "自动同步上游"
          body: |
            此 PR 由 GitHub Actions 自动创建或更新，随后会自动合并。
            变更仅同步自 eternity4719/HowToLiveBetter。

      - name: 自动合并上游同步 PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
