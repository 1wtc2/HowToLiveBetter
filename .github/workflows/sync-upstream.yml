name: 同步上游 fork

on:
  schedule:
    - cron: '23 2 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-upstream.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-fork
  cancel-in-progress: false

jobs:
  sync-fork:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # 上游有新提交时，git merge 会生成合并提交；Runner 必须先配置提交者身份。
      - name: 配置合并提交身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 准备上游同步
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/eternity4719/HowToLiveBetter.git
          git fetch upstream main

          # 只导入上游文件差异，保留本 fork 的 Actions；GITHUB_TOKEN 无权推送上游工作流修改。
          # 记录已同步的上游提交，让下次三方合并使用准确的基线，不重复导入旧改动。
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          def git(*args):
              return subprocess.check_output(["git", *args])

          state_path = Path(".github/upstream-sync.json")
          upstream = "eternity4719/HowToLiveBetter"
          target = git("rev-parse", "upstream/main").decode().strip()
          if state_path.exists():
              state = json.loads(state_path.read_text(encoding="utf-8"))
              if state.get("repository") != upstream:
                  raise SystemExit("上游同步记录的仓库不匹配")
              base = state.get("commit", "")
          else:
              base = git("merge-base", "HEAD", "upstream/main").decode().strip()
          if not re.fullmatch(r"[0-9a-f]{40}", base):
              raise SystemExit("上游同步基线不是有效的提交 SHA")
          subprocess.run(["git", "merge-base", "--is-ancestor", base, target], check=True)
          if base == target and state_path.exists():
              print("Fork 已包含上游最新内容")
              raise SystemExit(0)

          patch = git(
              "diff", "--binary", "--full-index", base, target, "--", ".",
              ":(exclude).github/workflows/**",
          )
          if patch:
              result = subprocess.run(["git", "apply", "--3way", "--index", "-"], input=patch)
              if result.returncode:
                  conflicts = [
                      name.decode("utf-8") for name in
                      git("diff", "--name-only", "--diff-filter=U", "-z").split(b"\0") if name
                  ]
                  if not conflicts or any(name not in {"README.md", "index.html"} for name in conflicts):
                      raise SystemExit("上游改动无法安全自动合并：" + ", ".join(conflicts))
                  # 这两个文件的 fork 定制是仓库与 Pages 链接，先取上游内容再恢复链接。
                  for name in conflicts:
                      Path(name).write_bytes(git("show", f"{target}:{name}"))

          fork = os.environ["GITHUB_REPOSITORY"]
          owner, name = fork.split("/", 1)
          replacements = (
              (f"https://github.com/{upstream}", f"https://github.com/{fork}"),
              ("https://eternity4719.github.io/HowToLiveBetter",
               f"https://{owner}.github.io/{name}"),
          )
          for name in ("README.md", "index.html"):
              file = Path(name)
              if not file.exists():
                  continue
              text = file.read_text(encoding="utf-8")
              for source, replacement in replacements:
                  text = text.replace(source, replacement)
              file.write_text(text, encoding="utf-8")
              subprocess.run(["git", "add", "--", name], check=True)

          state_path.write_text(
              json.dumps({"repository": upstream, "branch": "main", "commit": target},
                         ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          subprocess.run(["git", "add", "--", str(state_path)], check=True)
          if git("diff", "--cached", "--name-only", "--", ".github/workflows").strip():
              raise SystemExit("同步补丁意外修改了 fork 的 Actions 配置")
          PY

      - name: 创建或更新 fork 同步 PR
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: automation/sync-upstream
          delete-branch: true
          commit-message: "chore: 同步上游 fork"
          title: "自动同步上游"
          body: |
            此 PR 由 GitHub Actions 自动创建或更新，随后会自动合并。
            内容同步自 eternity4719/HowToLiveBetter，保留本 fork 的 Actions 配置。

      - name: 自动合并上游同步 PR
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --merge --delete-branch

      # GITHUB_TOKEN 创建的 PR 检查可能需要人工批准；合并后显式构建并发布 main 上的电子书。
      - name: 触发电子书构建与发布
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run book.yml --repo "$GITHUB_REPOSITORY" --ref main
